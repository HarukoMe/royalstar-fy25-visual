name: Deploy IF2 Conduct

on:
  push:
    branches: [main, cursor/if2-learning-engine-ff57]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test -w if2-conduct
      - name: Build for GitHub Pages
        env:
          IF2_BASE: /royalstar-fy25-visual/
        run: npm run build -w if2-conduct
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/if2/dist
          force_orphan: true
